# ============================================================
#  QQ 空间说说索引
# ------------------------------------------------------------
#  每条说说写成一个以「- date:」开头的块，例如：
#
#  - date: 2015-06-08
#    text: '高考结束，走出考场那天的太阳特别大'
#    link: 'https://user.qzone.qq.com/123456789/mood/abcdefghij'
#    images: 3
#
#  date   必填，说说发布当天（年-月-日）
#  text   可选，一句话摘要；不写就显示「说说」
#  link   必填，QQ空间那条说说的分享链接
#  images 可选，这条说说有几张图
#
#  怎么拿链接：手机 QQ 空间 → 打开那条说说 → 右上角「···」→ 分享/复制链接
#  注意：访客需要登录 QQ 才能看到内容，这是 QQ 空间本身的限制。
#
#  最省事的办法：双击桌面「写文章.bat」→ 选 6，按提示填，会自动追加到这里。
# ============================================================
